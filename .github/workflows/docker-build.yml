name: Build and Push Multi-Arch Docker Image

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: debian
            file: ./Dockerfile
          - variant: alpine
            file: ./Dockerfile.alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image for testing
        run: docker build -t tor-proxy-test:${{ matrix.variant }} -f ${{ matrix.file }} .

      - name: Run smoke test
        run: |
          docker run -d --name tor-test -p 9150:9150 -p 5353:5353/udp tor-proxy-test:${{ matrix.variant }}
          echo "Waiting for Tor to bootstrap..."
          sleep 30
          echo "Checking if container is running..."
          docker ps | grep tor-test
          echo "Checking SOCKS5 port..."
          nc -z 127.0.0.1 9150
          echo "Smoke test passed!"
          docker stop tor-test
          docker rm tor-test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: debian
            file: ./Dockerfile
            tags: |
              mstfknn/tor-proxy:latest
              mstfknn/tor-proxy:debian
              ghcr.io/mstfknn/tor-proxy:latest
              ghcr.io/mstfknn/tor-proxy:debian
          - variant: alpine
            file: ./Dockerfile.alpine
            tags: |
              mstfknn/tor-proxy:alpine
              ghcr.io/mstfknn/tor-proxy:alpine
          - variant: debian-bridge
            file: ./Dockerfile.debian-bridge
            tags: |
              mstfknn/tor-proxy:debian-bridge
              ghcr.io/mstfknn/tor-proxy:debian-bridge
          - variant: alpine-bridge
            file: ./Dockerfile.alpine-bridge
            tags: |
              mstfknn/tor-proxy:alpine-bridge
              ghcr.io/mstfknn/tor-proxy:alpine-bridge
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.variant }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mstfknn/tor-proxy:${{ matrix.variant }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container images
        run: |
          IMAGES=$(echo "${{ matrix.tags }}" | tr '\n' ' ')
          for IMAGE in $IMAGES; do
            IMAGE=$(echo "$IMAGE" | xargs)
            [ -n "$IMAGE" ] && cosign sign --yes "$IMAGE"
          done
        env:
          COSIGN_EXPERIMENTAL: "true"
